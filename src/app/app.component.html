<div class="app-root" cdkDropListGroup>
  <app-sidebar></app-sidebar>

  <div class="main-area">
    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="top-bar-title">
          <span class="breadcrumb-sep">Form Builder</span>
        </div>
      </div>
      <div class="top-bar-right">
        <button class="preview-btn-top" type="button" (click)="formService.previewMode.set(true)">
          <span>👁</span> Preview
        </button>
        <app-code-modal></app-code-modal>
      </div>
    </header>

    <!-- CANVAS -->
    <div class="canvas-container">
      <app-canvas></app-canvas>
    </div>
  </div>

  <!-- PREVIEW OVERLAY -->
  <app-preview *ngIf="formService.previewMode()"></app-preview>
</div>
