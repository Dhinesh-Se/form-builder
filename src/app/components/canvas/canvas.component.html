<div class="canvas-wrapper">
  <div class="toolbar">
    <span class="toolbar-title">
      Form Canvas
      <span class="badge">{{ formService.formElements.length }} elements</span>
    </span>
    <button class="btn btn-danger" (click)="clearAll()">Clear All</button>
  </div>

  <div
    class="canvas"
    cdkDropList
    id="canvas-list"
    [cdkDropListData]="formService.formElements"
    (cdkDropListDropped)="onDrop($event)"
  >
    <div class="empty-hint" *ngIf="formService.formElements.length === 0">
      ⬇ Drag and drop components here
    </div>

    <div *ngFor="let el of formService.formElements" class="form-element">
      <ng-container [ngSwitch]="el.type">
        <ng-container *ngSwitchCase="'text'">
          <label>{{ el.label }}</label>
          <input type="text" [placeholder]="el.placeholder" disabled />
        </ng-container>

        <ng-container *ngSwitchCase="'email'">
          <label>{{ el.label }}</label>
          <input type="email" [placeholder]="el.placeholder" disabled />
        </ng-container>

        <ng-container *ngSwitchCase="'number'">
          <label>{{ el.label }}</label>
          <input type="number" [placeholder]="el.placeholder" disabled />
        </ng-container>

        <ng-container *ngSwitchCase="'password'">
          <label>{{ el.label }}</label>
          <input type="password" [placeholder]="el.placeholder" disabled />
        </ng-container>

        <ng-container *ngSwitchCase="'date'">
          <label>{{ el.label }}</label>
          <input type="date" disabled />
        </ng-container>

        <ng-container *ngSwitchCase="'textarea'">
          <label>{{ el.label }}</label>
          <textarea disabled [placeholder]="el.placeholder"></textarea>
        </ng-container>

        <ng-container *ngSwitchCase="'checkbox'">
          <div class="inline-field">
            <input type="checkbox" disabled />
            <label>{{ el.label }}</label>
          </div>
        </ng-container>

        <ng-container *ngSwitchCase="'radio'">
          <div class="inline-field">
            <input type="radio" disabled />
            <label>{{ el.label }}</label>
          </div>
        </ng-container>

        <ng-container *ngSwitchCase="'select'">
          <label>{{ el.label }}</label>
          <select disabled>
            <option value="">Select an option</option>
            <option *ngFor="let option of el.options" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </ng-container>

        <ng-container *ngSwitchCase="'button'">
          <button class="preview-btn" disabled>{{ el.label }}</button>
        </ng-container>

        <ng-container *ngSwitchDefault>
          <label>{{ el.label }}</label>
          <input [type]="el.type" [placeholder]="el.placeholder" disabled />
        </ng-container>
      </ng-container>

      <button class="delete-btn" (click)="deleteElement(el.id)">✕</button>
    </div>
  </div>
</div>
