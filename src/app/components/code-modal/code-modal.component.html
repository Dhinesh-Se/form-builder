<button class="export-btn" type="button" (click)="generate()">
  <span>⚡</span> Export Code
</button>

<div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-header-left">
        <span class="modal-badge">Export</span>
        <h3>Generated Code</h3>
      </div>
      <div class="modal-header-right">
        <select class="framework-select" [ngModel]="framework" (ngModelChange)="setFramework($event)">
          <option value="angular">Angular</option>
          <option value="react">React</option>
          <option value="vanilla">Vanilla HTML/JS</option>
        </select>
        <button class="modal-close" type="button" (click)="closeModal()">✕</button>
      </div>
    </div>

    <div class="modal-tabs">
      <button class="modal-tab" [class.active]="activeTab === 'html'" (click)="activeTab = 'html'">
        📄 {{ framework === 'react' ? 'Component (JSX)' : (framework === 'vanilla' ? 'HTML' : 'Template') }}
      </button>
      <button class="modal-tab" [class.active]="activeTab === 'css'" (click)="activeTab = 'css'">
        🎨 Styles
      </button>
      <button *ngIf="framework !== 'react'" class="modal-tab" [class.active]="activeTab === 'ts'" (click)="activeTab = 'ts'">
        ⚙ {{ framework === 'vanilla' ? 'JavaScript' : 'Component (TS)' }}
      </button>
    </div>

    <div class="modal-body">
      <textarea class="code-area" readonly>{{ currentCode }}</textarea>
    </div>

    <div class="modal-footer">
      <span class="modal-hint">Copy the code and paste it into your {{ framework === 'vanilla' ? 'Vanilla' : (framework === 'react' ? 'React' : 'Angular') }} project</span>
      <div class="modal-actions">
        <button class="btn-copy" type="button" (click)="downloadFolder()">📦 Download Folder</button>
        <button class="btn-copy" type="button" (click)="copyCode()">{{ copyLabel }}</button>
        <button class="btn-close-m" type="button" (click)="closeModal()">Close</button>
      </div>
    </div>
  </div>
</div>
