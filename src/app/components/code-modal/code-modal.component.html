<button class="btn btn-primary" type="button" (click)="generate()">
  <span>⚡</span>
  Generate Code
</button>

<div class="modal-backdrop" *ngIf="showModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="generated-code-title">
    <div class="modal-header">
      <div>
        <span class="modal-eyebrow">Export</span>
        <h3 id="generated-code-title">Generated Angular Template</h3>
      </div>
      <button class="close-btn" type="button" aria-label="Close generated code modal" (click)="closeModal()">✕</button>
    </div>
    <textarea class="code-area" readonly>{{ generatedCode }}</textarea>
    <div class="modal-footer">
      <button class="btn btn-copy" type="button" (click)="copyCode()">{{ copyLabel }}</button>
      <button class="btn" type="button" (click)="closeModal()">Close</button>
    </div>
  </section>
</div>
